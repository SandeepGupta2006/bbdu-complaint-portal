{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Verify OTP | BBDU</title>

    <link rel="stylesheet" href="{% static 'accounts/login.css' %}" />
  </head>

  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">🎓</div>

        <h1>BBDU Complaint Portal</h1>

        <h2>Verify OTP</h2>

        <p class="auth-description">
          If an account exists with this email, a verification code
    has been sent to your registered BBDU email address.
        </p>

        {% if error %}

        <div class="error-message">{{ error }}</div>

        {% endif %}

        <form method="POST">
          {% csrf_token %}

          <div class="form-group">
            <label for="otp"> Verification Code </label>

            <input
              type="text"
              id="otp"
              name="otp"
              placeholder="Enter 6-digit OTP"
              maxlength="6"
              inputmode="numeric"
              autocomplete="one-time-code"
              required
            />
          </div>

          <button type="submit" class="auth-button">Verify OTP</button>
        </form>

        <div class="auth-footer">
          <a href="{% url 'forgot_password' %}"> ← Request a new OTP </a>
        </div>
      </div>
    </div>
  </body>
</html>
