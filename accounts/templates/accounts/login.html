{% load static %}

<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Login | BBDU</title>

    <link rel="stylesheet" href="{% static 'accounts/login.css' %}" />
  </head>

  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo">🎓</div>

          <h1>BBDU Grievance Portal</h1>

          <p>Student Login</p>
        </div>

        {% if form.errors %}

        <div class="error-message">
          Please check your username and password.
        </div>

        {% endif %}

        <form method="POST">
          {% csrf_token %}

          <div class="form-group">
            <label for="id_username"> Username </label>

            <input
              type="text"
              name="username"
              id="id_username"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="id_password"> Password </label>

            <input
              type="password"
              name="password"
              id="id_password"
              autocomplete="current-password"
              required
            />
            <div class="forgot-password">
              <a href="{% url 'forgot_password' %}"> Forgot Password? </a>
            </div>
          </div>

          <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="register-link">
          Don't have an account?

          <a href="{% url 'register_student' %}"> Create Account </a>
        </div>

        <div class="staff-link">
          Are you a university staff member?

          <a href="{% url 'staff_login' %}"> Staff Login </a>
        </div>

        <div class="back-link">
          <a href="{% url 'home' %}"> ← Back to Home </a>
        </div>
      </div>
    </div>
  </body>
</html>
