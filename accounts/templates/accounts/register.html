{% load static %}

<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Student Account | BBDU</title>

    <link rel="icon" type="image/png" href="{% static 'complaints/images/bbd_logo.png' %}" />

    <link rel="stylesheet" href="{% static 'accounts/register.css' %}" />
  </head>
  
  <body>
    <div class="register-container">
      <div class="register-card">
        <div class="register-header">
          <div class="logo">🎓</div>

          <h1>Create Student Account</h1>

          <p>Register for the BBDU Grievance Portal</p>
        </div>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST">
          {% csrf_token %}

          <div class="form-row">
            <div class="form-group">
              <label for="first_name"> First Name </label>

              <input type="text" id="first_name" name="first_name" required />
            </div>

            <div class="form-group">
              <label for="last_name"> Last Name </label>

              <input type="text" id="last_name" name="last_name" required />
            </div>
          </div>

          <div class="form-group">
            <label for="username"> Username </label>

            <input type="text" id="username" name="username" required />
          </div>

          <div class="form-group">
            <label for="email"> University Email </label>

            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="roll_number"> Roll Number </label>

            <input type="text" id="roll_number" name="roll_number" required />
          </div>

          <div class="form-group">
            <label for="department"> Department </label>

            <input type="text" id="department" name="department" required />
          </div>

          <div class="form-group">
            <label for="course"> Course </label>

            <input type="text" id="course" name="course" required />
          </div>

          <div class="form-group">
            <label for="year"> Year </label>

            <select id="year" name="year" required>
              <option value="">Select Year</option>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year</option>
            </select>
          </div>

          <div class="form-group">
            <label for="password"> Password </label>

            <input type="password" id="password" name="password" required />
          </div>

          <button type="submit" class="register-btn">Create Account</button>
        </form>

        <div class="login-link">
          Already have an account?

          <a href="{% url 'login' %}"> Student Login </a>
        </div>

        <div class="back-link">
          <a href="{% url 'home' %}"> ← Back to Home </a>
        </div>
      </div>
    </div>
  </body>
</html>
