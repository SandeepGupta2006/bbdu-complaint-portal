{% load static %}

<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Staff Login | BBDU</title>

    <link rel="stylesheet" href="{% static 'accounts/staff_login.css' %}" />
  </head>

  <body>
    <div class="staff-login-container">
      <div class="staff-login-card">
        <div class="staff-login-header">
          <div class="logo">🎓</div>

          <h1>BBDU Grievance Portal</h1>

          <p>Staff Login</p>
        </div>

        {% if error %}

        <div class="error-message">{{ error }}</div>

        {% endif %}

        <form method="POST">
          {% csrf_token %}

          <div class="form-group">
            <label for="username"> Username </label>

            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="password"> Password </label>

            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit" class="staff-login-btn">Staff Login</button>
        </form>

        <div class="student-link">
          Are you a student?

          <a href="{% url 'login' %}"> Student Login </a>
        </div>

        <div class="back-link">
          <a href="{% url 'home' %}"> ← Back to Home </a>
        </div>
      </div>
    </div>
  </body>
</html>
