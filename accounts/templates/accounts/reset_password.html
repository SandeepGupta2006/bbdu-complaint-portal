{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password | BBDU</title>

    <link rel="stylesheet" href="{% static 'accounts/login.css' %}" />
  </head>

  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">🎓</div>

        <h1>BBDU Complaint Portal</h1>

        <h2>Reset Password</h2>

        <p class="auth-description">Create a new password for your account.</p>

        {% if error %}

        <div class="error-message">{{ error }}</div>

        {% endif %}

        <form method="POST">
          {% csrf_token %}

          <div class="form-group">
            <label for="password"> New Password </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter new password"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirm_password"> Confirm New Password </label>

            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              placeholder="Re-enter new password"
              autocomplete="new-password"
              required
            />
          </div>

          <button type="submit" class="auth-button">Reset Password</button>
        </form>

        <div class="auth-footer">
          <a href="{% url 'login' %}"> ← Back to Student Login </a>
        </div>
      </div>
    </div>
  </body>
</html>
